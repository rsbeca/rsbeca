name: Gerar cobrinha

on:
  schedule:
    - cron: "0 */12 * * *"   # atualiza a cada 12h
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#ff69b4&color_dots=#fde2ef,#f9b4d3,#f483b5,#e75497,#c2185b
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff8fd8&color_dots=#2d1b2e,#5c2a5e,#8e3b8f,#c45ec6,#f39bf5

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
